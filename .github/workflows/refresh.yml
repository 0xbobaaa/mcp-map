name: refresh data
on:
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collect.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "0xbobaaa"
          git config user.email "0xbobaaa@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
